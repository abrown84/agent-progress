plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = file("${System.getenv('HOME')}/.config/agent-progress/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def ciStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def ciStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ciKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def ciKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'com.brwnindustries.agentprogress'
    compileSdk 34

    defaultConfig {
        applicationId "com.brwnindustries.agentprogress"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        def launcherUrl = project.findProperty('launcherUrl') ?: 'https://progress.brwnindustries.com/'
        def updateManifestUrl = project.findProperty('updateManifestUrl') ?: 'https://progress.brwnindustries.com/android/latest.json'
        buildConfigField "String", "LAUNCHER_URL", "\"${launcherUrl}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updateManifestUrl}\""
        buildConfigField "String", "API_ORIGIN", "\"https://progress.brwnindustries.com\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (ciStoreFile) {
                storeFile file(ciStoreFile)
                storePassword ciStorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            } else if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciStoreFile || keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Firebase Cloud Messaging (replace google-services.json with Alex's project)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.24'
}
